<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Santo Ofício — Mesa &amp; Grimório</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vtt.css">
</head>
<body>
  <svg class="bg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="sp" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="4" seed="11"/>
        <feDisplacementMap in="SourceGraphic" scale="150"/>
      </filter>
      <radialGradient id="g" cx="50%" cy="45%" r="75%">
        <stop offset="0" stop-color="#1c0406"/>
        <stop offset="1" stop-color="#2c2626"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="640" fill="url(#g)"/>
    <g filter="url(#sp)" fill="#5e0810">
      <circle cx="70" cy="90" r="95"/><circle cx="930" cy="60" r="85"/>
      <circle cx="40" cy="520" r="110"/><circle cx="960" cy="560" r="120"/>
      <circle cx="500" cy="-10" r="60"/><circle cx="480" cy="660" r="70"/>
    </g>
    <g filter="url(#sp)" fill="#240305">
      <circle cx="150" cy="300" r="40"/><circle cx="860" cy="330" r="45"/>
    </g>
  </svg>

  <div class="bgimg" id="bgi"></div>
  <div class="fog"></div>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="fk"></div>
  <div id="drips" aria-hidden="true"></div>

  <nav class="topbar" id="nv" hidden></nav>
  <div class="sheet-bar" id="sheet-bar" hidden></div>
  <main class="wrap" id="app"></main>

  <div class="mdl" id="md" data-act="close"></div>
  <input type="file" id="pick" accept="image/*" hidden>
  <input type="file" id="vtt-file-pick" accept="image/*" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="player-sheet.js"></script>
  <script src="vtt-map.js"></script>
</body>
</html>
