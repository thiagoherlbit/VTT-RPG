<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grimório — Fichas de RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+English+SC&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-sigil">✦</span>
        <span class="brand-title">Grimório da Mesa</span>
      </div>
      <nav class="nav-actions" id="nv"></nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <input type="file" id="avatar-picker" accept="image/*" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="player-sheet.js"></script>
</body>
</html>
